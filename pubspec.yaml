name: logbook_app_001
description: "Sistem Logbook Digital dengan persistensi Hive lokal dan sinkronisasi MongoDB Atlas."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.10.8 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Manajemen database biner lokal dan preferensi pengguna
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2
  path_provider: ^2.1.5

  # Integrasi database cloud dan manajemen variabel lingkungan
  mongo_dart: ^0.10.8
  flutter_dotenv: ^5.1.0

  # Utilitas format tanggal dan lokalisasi internasional
  intl: ^0.20.2
  connectivity_plus: ^7.0.0
  flutter_markdown: ^0.7.7+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

  # Perkakas otomasi pembuatan kode untuk adaptor Hive
  build_runner: ^2.4.8
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  # Konfigurasi aset statis dan file lingkungan
  assets:
    - .env
    - assets/images/